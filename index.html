<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>

    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <header class="page-header">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower matrix" />
      <a
        class="more-info"
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>

    <main class="todo-app">
      <section class="task-form-section">
        <label for="new-task">Add Item</label>

        <div class="task-form">
          <input id="new-task" class="task-input" type="text" />
          <button class="add-button" type="button">Add</button>
        </div>
      </section>

      <section class="task-section">
        <h2>Todo</h2>

        <ul id="todo-list" class="task-list">
          <li class="task-item">
            <input type="checkbox" />
            <label class="task-label">Pay Bills</label>
            <input type="text" class="task-input edit-input" />
            <button class="edit-button" type="button">Edit</button>
            <button class="delete-button" type="button">
              <img src="./remove.svg" alt="Delete task" />
            </button>
          </li>

          <li class="task-item edit-mode">
            <input type="checkbox" />
            <label class="task-label">Go Shopping</label>
            <input
              type="text"
              value="Go Shopping"
              class="task-input edit-input"
            />
            <button class="edit-button" type="button">Save</button>
            <button class="delete-button" type="button">
              <img src="./remove.svg" alt="Delete task" />
            </button>
          </li>
        </ul>
      </section>

      <section class="task-section">
        <h2>Completed</h2>

        <ul id="completed-list" class="task-list">
          <li class="task-item">
            <input type="checkbox" checked />
            <label class="task-label">See the Doctor</label>
            <input type="text" class="task-input edit-input" />
            <button class="edit-button" type="button">Edit</button>
            <button class="delete-button" type="button">
              <img src="./remove.svg" alt="Delete task" />
            </button>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
